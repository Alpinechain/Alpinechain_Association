<!doctype html>
<html lang="fr">
  <head>

        <p class="eyebrow">BIENVENUE</p>

      <span>7–9 NOVEMBRE · ANNECY</span
      ><span id="sync" role="status">Connexion au serveur local…</span
      ><button id="fullscreen" type="button">Plein écran</button>
