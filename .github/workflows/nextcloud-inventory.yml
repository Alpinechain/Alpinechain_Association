name: Nextcloud Inventory

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/inventory-nextcloud-public-share.py"
      - ".github/workflows/nextcloud-inventory.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: nextcloud-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inventory public Nextcloud share
        id: inventory
        continue-on-error: true
        env:
          NEXTCLOUD_BASE_URL: https://cloud.alpinechain.xyz
          NEXTCLOUD_SHARE_TOKEN: 6aBTY243WDkbSGL
          NEXTCLOUD_INVENTORY_OUTPUT: references/nextcloud-inventory.generated.md
        run: |
          set -o pipefail
          python3 scripts/inventory-nextcloud-public-share.py \
            2>&1 | tee "$RUNNER_TEMP/nextcloud-inventory.log"

      - name: Publish inventory issue
        if: ${{ steps.inventory.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[NEXTCLOUD] Inventaire du partage public"
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"

          python3 - <<'PY'
          from pathlib import Path
          source = Path('references/nextcloud-inventory.generated.md').read_text(encoding='utf-8')
          limit = 58000
          if len(source) > limit:
              source = source[:limit] + '\n\n> Inventaire tronqué dans l’Issue. Le fichier généré complet reste dans le dépôt.\n'
          Path('/tmp/nextcloud-inventory-issue.md').write_text(source, encoding='utf-8')
          PY

          {
            echo
            echo "## Exécution"
            echo
            echo "$RUN_URL"
          } >> /tmp/nextcloud-inventory-issue.md

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/nextcloud-inventory-issue.md
          else
            gh issue create \
              --title "$title" \
              --body-file /tmp/nextcloud-inventory-issue.md \
              --assignee Copinmalin \
              --label project:association \
              --label type:task \
              --label area:technical
          fi

      - name: Commit generated inventory
        if: ${{ steps.inventory.outcome == 'success' }}
        continue-on-error: true
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          if git diff --quiet -- references/nextcloud-inventory.generated.md; then
            echo "Inventory unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/nextcloud-inventory.generated.md
          git commit -m "Update generated Nextcloud inventory"

          if [ -n "$PROJECTS_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${PROJECTS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git push origin HEAD:main

      - name: Report inventory failure
        if: ${{ steps.inventory.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[INFRA] Échec de l’inventaire Nextcloud public"
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"

          {
            echo "## Échec automatique"
            echo
            echo "Le partage public Nextcloud n’a pas pu être inventorié."
            echo
            echo '```text'
            tail -n 100 "$RUNNER_TEMP/nextcloud-inventory.log"
            echo '```'
            echo
            echo "Run : $RUN_URL"
          } > "$RUNNER_TEMP/nextcloud-inventory-issue.md"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/nextcloud-inventory-issue.md"
          else
            gh issue create \
              --title "$title" \
              --body-file "$RUNNER_TEMP/nextcloud-inventory-issue.md" \
              --assignee Copinmalin \
              --label project:association \
              --label type:incident \
              --label area:technical \
              --label human-validation
          fi

          exit 1
