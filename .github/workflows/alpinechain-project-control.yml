name: AlpineChain Project Control

"on":
  issues:
    types:
      - opened
      - reopened
      - transferred
      - labeled
      - unlabeled
      - edited
      - closed
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - reconcile
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: alpinechain-project-control
  cancel-in-progress: false

env:
  PROJECT_OWNER: Alpinechain
  PROJECT_NUMBER: "1"
  TARGET_REPOSITORY: Alpinechain/Alpinechain_Association

jobs:
  control-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secret
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          if [ -z "$PROJECTS_TOKEN" ]; then
            echo "::error::Missing repository secret PROJECTS_TOKEN."
            echo "Create a GitHub personal access token with Projects write access"
            echo "and store it as Actions secret PROJECTS_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Verify Project token owner
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          authenticated_login="$(gh api user --jq .login)"
          if [ "${authenticated_login,,}" != "${PROJECT_OWNER,,}" ]; then
            echo "::error::PROJECTS_TOKEN belongs to '$authenticated_login', but this user Project belongs to '$PROJECT_OWNER'."
            echo "Create the token while authenticated as the Alpinechain account."
            exit 1
          fi
          echo "Authenticated Project owner: $authenticated_login"

      - name: Run project controller
        id: controller
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          ISSUE_URL: ${{ github.event.issue.html_url || '' }}
          DISPATCH_OPERATION: ${{ inputs.operation || '' }}
        run: |
          chmod +x .github/scripts/project-control.sh

          # `gh project` can fail to resolve an explicit login for user-owned
          # Projects in Actions. GitHub CLI documents `@me` as the canonical
          # selector for the current user's Project. The GraphQL owner lookup
          # remains unchanged and continues to use PROJECT_OWNER.
          sed -i 's/--owner "$PROJECT_OWNER"/--owner "@me"/g' \
            .github/scripts/project-control.sh

          set +e
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            .github/scripts/project-control.sh "$DISPATCH_OPERATION" 2>&1 \
              | tee "$RUNNER_TEMP/project-control.log"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            .github/scripts/project-control.sh reconcile 2>&1 \
              | tee "$RUNNER_TEMP/project-control.log"
          else
            .github/scripts/project-control.sh issue-event "$ISSUE_URL" "$EVENT_ACTION" 2>&1 \
              | tee "$RUNNER_TEMP/project-control.log"
          fi
          controller_exit="${PIPESTATUS[0]}"
          set -e

          echo "exit_code=$controller_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report result on triggering issue
        if: ${{ always() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          CONTROLLER_EXIT: ${{ steps.controller.outputs.exit_code }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CONTROLLER_EXIT" = "0" ]; then
            marker="✅"
            result="success"
          else
            marker="❌"
            result="failure"
          fi

          report="$RUNNER_TEMP/project-control-report.md"
          {
            echo "$marker AlpineChain Project Control : **$result**"
            echo
            echo "Exécution : $RUN_URL"

            if [ "$CONTROLLER_EXIT" != "0" ] && [ -f "$RUNNER_TEMP/project-control.log" ]; then
              echo
              echo "<details><summary>Dernières lignes du contrôleur</summary>"
              echo
              echo '```text'
              tail -n 30 "$RUNNER_TEMP/project-control.log" \
                | sed -E $'s/\x1B\[[0-9;]*[mK]//g'
              echo '```'
              echo "</details>"
            fi
          } > "$report"

          gh issue comment "$ISSUE_URL" --body-file "$report"

      - name: Fail job when controller failed
        if: ${{ steps.controller.outputs.exit_code != '0' }}
        env:
          CONTROLLER_EXIT: ${{ steps.controller.outputs.exit_code }}
        run: |
          echo "::error::Project controller exited with status $CONTROLLER_EXIT"
          exit "$CONTROLLER_EXIT"
