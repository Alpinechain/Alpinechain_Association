name: Deploy B-Only Programme

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-b-only-programme.yml"
      - "projects/b-only/programme/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate programme
        run: node projects/b-only/programme/validate.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload programme
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/b-only/programme

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
