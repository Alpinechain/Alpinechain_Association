name: Deploy B-Only Programme

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-b-only-programme.yml"
      - "projects/b-only/programme/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-b-only-programme.yml"
      - "projects/b-only/programme/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate programme
        run: node projects/b-only/programme/validate.mjs

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload programme
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: projects/b-only/programme

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
